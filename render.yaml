# Production on Render: one always-on Docker web service and a private Postgres database.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: true-size-chart
    runtime: docker
    region: ohio
    plan: starter
    numInstances: 1          # the in-memory RateLimiter assumes one instance
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_APP_URL
        value: https://true-size-chart.onrender.com
      - key: SCOPES
        value: write_products,write_metaobjects,write_metaobject_definitions,write_app_proxy
      - key: SHOPIFY_APP_HANDLE
        value: true-size-chart
      - key: DATABASE_URL
        fromDatabase:
          name: true-size-chart-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_PARTNER_ORG_ID
        sync: false
      - key: SHOPIFY_PARTNER_API_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_APP_GID
        sync: false

databases:
  - name: true-size-chart-db
    region: ohio
    postgresMajorVersion: "17"
    databaseName: tsc
    user: tsc
    ipAllowList: []          # private network only
