mutation SeedApparelProduct($input: ProductSetInput!) {
  productSet(synchronous: true, input: $input) {
    product {
      id
      handle
      status
      variants(first: 10) {
        nodes {
          id
          title
          availableForSale
          inventoryItem {
            tracked
          }
        }
      }
    }
    userErrors {
      field
      message
      code
    }
  }
}
