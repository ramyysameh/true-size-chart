# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "87a1e91cb347cde878814b5506901348"
name = "True: Size Chart"
application_url = "https://true-size-chart.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions,write_app_proxy"

# A size chart a merchant builds once and assigns to many products.
# `table` holds the engine's ChartTable JSON: { sizes: string[], measurements: { chest?: (number|null)[], ... } }.
[metaobjects.app.size_chart]
name = "Size chart"
description = "A True: Size Chart size chart"
display_name_field = "name"

  [metaobjects.app.size_chart.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[metaobjects.app.size_chart.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.size_chart.fields.category]
name = "Category"
description = "tshirt, shirt, hoodie, jacket, dress, pants, shorts or skirt"
type = "single_line_text_field"
validations.choices = ["tshirt", "shirt", "hoodie", "jacket", "dress", "pants", "shorts", "skirt"]
required = true

[metaobjects.app.size_chart.fields.audience]
name = "Audience"
description = "women, men or unisex"
type = "single_line_text_field"
validations.choices = ["women", "men", "unisex"]

[metaobjects.app.size_chart.fields.unit]
name = "Unit"
description = "cm or in"
type = "single_line_text_field"
validations.choices = ["cm", "in"]
required = true

[metaobjects.app.size_chart.fields.basis]
name = "Measured as"
description = "garment_flat, garment_circ or body"
type = "single_line_text_field"
validations.choices = ["garment_flat", "garment_circ", "body"]
required = true

[metaobjects.app.size_chart.fields.intended_fit]
name = "Intended fit"
description = "slim, regular or oversized"
type = "single_line_text_field"
validations.choices = ["slim", "regular", "oversized"]
required = true

[metaobjects.app.size_chart.fields.table]
name = "Measurements"
type = "json"
required = true

[metaobjects.app.size_chart.fields.how_to_measure]
name = "How to measure"
type = "multi_line_text_field"

# Written by the app from assignment rules so the storefront reads the chart with Liquid alone.
[product.metafields.app.size_chart]
type = "metaobject_reference<$app:size_chart>"
name = "Size chart"
description = "The True: Size Chart chart shown on this product"

  [product.metafields.app.size_chart.access]
  admin = "merchant_read"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [ "products/create", "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

# Storefront finder events: /apps/tsc/e on the shop's domain reaches /proxy/e here.
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "tsc"

[auth]
redirect_urls = [ "https://true-size-chart.vercel.app/auth/callback" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
